name: Validate public notes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unit and HTTP integration tests
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check public/app.js
      - name: Publication privacy checks
        run: python3 scripts/check_public.py --history
